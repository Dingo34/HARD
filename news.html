<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — HARD Roleplay</title>
    <link rel="icon" type="image/png" href="logo.png?v=1">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="toggle.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root{
            --nw-modal-bg:#101010;
            --nw-modal-border:#2a2a2a;
            --nw-modal-header:#141414;
            --nw-modal-border2:#303030;
            --nw-text:#e9e9e9;
            --nw-text-muted:#c7c7c7;
            --nw-scroll-thumb:#555;
        }
        body.light-theme{
            --nw-modal-bg:#ffffff;
            --nw-modal-border:#dcdcdc;
            --nw-modal-header:#f5f5f5;
            --nw-modal-border2:#dcdcdc;
            --nw-text:#1a1a1a;
            --nw-text-muted:#444444;
            --nw-scroll-thumb:#b5b5b5;
        }

        .news-wrapper{ margin-top:30px;display:flex;flex-direction:column;gap:18px; }

        .news-hero{
            display:block;text-decoration:none;color:#fff;
            border-radius:6px;overflow:hidden;position:relative;
            min-height:340px;background:#0e0e0e;
            background-size:cover;background-position:center;
            border:1px solid #2a2a2a;cursor:pointer;
            transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
        }
        .news-hero::after{
            content:"";position:absolute;inset:0;
            background:
                linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.88) 100%),
                linear-gradient(90deg, rgba(0,0,0,.55) 0%, transparent 55%);
            z-index:1;
        }
        .news-hero:hover{
            transform:translateY(-4px);
            border-color:rgba(226,29,47,.5);
            box-shadow:0 22px 45px rgba(0,0,0,.6), 0 0 0 1px rgba(226,29,47,.3);
        }
        .news-hero-content{
            position:relative;z-index:2;
            padding:28px 30px 26px;
            display:flex;flex-direction:column;justify-content:flex-end;
            min-height:340px;box-sizing:border-box;
        }

        .news-row{ display:grid;grid-template-columns:1fr 1fr;gap:18px; }
        @media(max-width:820px){ .news-row{ grid-template-columns:1fr; } }

        .news-card{
            display:block;text-decoration:none;color:#fff;
            border-radius:6px;overflow:hidden;position:relative;
            min-height:260px;background:#0e0e0e;
            background-size:cover;background-position:center;
            border:1px solid #2a2a2a;cursor:pointer;
            transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
        }
        .news-card::after{
            content:"";position:absolute;inset:0;
            background:
                linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.88) 100%),
                linear-gradient(90deg, rgba(0,0,0,.55) 0%, transparent 55%);
            z-index:1;
        }
        .news-card:hover{
            transform:translateY(-4px);
            border-color:rgba(226,29,47,.5);
            box-shadow:0 22px 45px rgba(0,0,0,.6), 0 0 0 1px rgba(226,29,47,.3);
        }
        .news-card-content{
            position:relative;z-index:2;
            padding:24px 24px 22px;
            display:flex;flex-direction:column;justify-content:flex-end;
            min-height:260px;box-sizing:border-box;
        }

        .news-tag{
            display:inline-block;background:#e21d2f;color:#fff;
            font-size:10px;font-weight:900;letter-spacing:.14em;
            text-transform:uppercase;padding:4px 9px;border-radius:3px;
            margin-bottom:12px;align-self:flex-start;
        }
        .news-date{
            font-size:10px;color:rgba(255,255,255,.7);
            font-weight:700;letter-spacing:.12em;text-transform:uppercase;
            margin-bottom:6px;
        }
        .news-title{
            font-size:26px;line-height:1.1;font-weight:900;
            text-transform:uppercase;letter-spacing:.01em;
            margin:0 0 10px;color:#fff;
            text-shadow:0 2px 12px rgba(0,0,0,.85);
        }
        .news-card .news-title{ font-size:20px; }

        .news-excerpt{
            font-size:12px;line-height:1.55;
            color:rgba(255,255,255,.72);
            margin:0 0 16px;max-width:520px;
        }

        .news-read{
            font-size:10px;font-weight:900;letter-spacing:.18em;
            text-transform:uppercase;color:#fff;
            display:inline-flex;align-items:center;gap:8px;
            transition:gap .25s ease, color .25s ease;
        }
        .news-read::before{
            content:"";width:16px;height:1px;background:#e21d2f;
            transition:width .25s ease;
        }
        .news-hero:hover .news-read,
        .news-card:hover .news-read{ color:#e21d2f; gap:12px; }
        .news-hero:hover .news-read::before,
        .news-card:hover .news-read::before{ width:26px; }

        .news-modal{
            position:fixed;inset:0;background:rgba(0,0,0,.85);
            display:none;align-items:center;justify-content:center;
            z-index:9999;padding:24px;backdrop-filter:blur(6px);
            font-family:'Montserrat',Arial,sans-serif;
        }
        .news-modal.open{ display:flex; }
        .news-modal-box{
            background:var(--nw-modal-bg);
            border:1px solid var(--nw-modal-border);
            border-radius:10px;
            width:min(900px,100%);max-height:90vh;
            overflow-y:auto;color:var(--nw-text);
            position:relative;box-shadow:0 25px 60px rgba(0,0,0,.7);
            scrollbar-width:thin;
            scrollbar-color:var(--nw-scroll-thumb) transparent;
            transition:background .35s ease, border-color .35s ease, color .35s ease;
        }
        .news-modal-box::-webkit-scrollbar{ width:8px; }
        .news-modal-box::-webkit-scrollbar-track{ background:transparent; }
        .news-modal-box::-webkit-scrollbar-thumb{ background:var(--nw-scroll-thumb);border-radius:8px;border:none; }

        .news-modal-close{
            position:absolute;top:14px;right:16px;
            background:rgba(0,0,0,.6);
            border:1px solid rgba(255,255,255,.15);
            color:#fff;width:36px;height:36px;border-radius:50%;
            cursor:pointer;font-size:18px;line-height:1;
            display:flex;align-items:center;justify-content:center;
            z-index:5;transition:background .2s ease, border-color .2s ease;
        }
        .news-modal-close:hover{ background:#e21d2f;border-color:#e21d2f; }

        .news-modal-image{
            width:100%;min-height:280px;background:#0a0a0a;
            background-size:cover;background-position:center;
            border-bottom:1px solid var(--nw-modal-border2);
            transition:border-color .35s ease;
        }
        .news-modal-body{ padding:26px 30px 32px; }
        .news-modal-body .news-tag{ margin-bottom:14px; }
        .news-modal-body .news-date{
            font-size:11px;color:var(--nw-text-muted);
            margin-bottom:10px;transition:color .35s ease;
        }
        .news-modal-body .news-title{
            font-size:32px;margin-bottom:18px;
            color:var(--nw-text);text-shadow:none;
            transition:color .35s ease;
        }
        .news-modal-body .news-text{
            font-size:15px;line-height:1.8;
            color:var(--nw-text-muted);white-space:pre-line;
            transition:color .35s ease;
        }
        @media(max-width:600px){
            .news-modal-body{ padding:20px; }
            .news-modal-body .news-title{ font-size:22px; }
            .news-modal-body .news-text{ font-size:14px; }
        }
    </style>
</head>
<body>
    <div class="main-bg"></div>
    <div class="main-bg-overlay"></div>

    <header class="main-header">
        <a href="index.html" class="header-left">
            <img src="logo.png" alt="HARD Roleplay" class="header-logo">
            <div class="header-brand">
                <span class="brand-hard">HARD</span>
                <span class="brand-divider">|</span>
                <span class="brand-houston">HOUSTON</span>
            </div>
        </a>

        <nav class="header-nav">
            <a href="index.html#main" class="nav-link">Главное меню</a>
            <a href="lore.html" class="nav-link">Лор города</a>
            <a href="fractions.html" class="nav-link">Фракции и правила</a>
            <a href="professions.html" class="nav-link">Профессии</a>
            <a href="map.html" class="nav-link">Карта города</a>
            <a href="news.html" class="nav-link active">Новости</a>
            <a href="changes.html" class="nav-link">Изменения</a>
            <a href="forum.html" class="nav-link">Форум</a>
        </nav>

        <div class="header-right">
            <div class="theme-toggle-box"></div>
            <a href="index.html#login" class="btn-login">ВОЙТИ</a>
        </div>
    </header>

    <div class="page-container">
        <div class="page-label">05 / НОВОСТИ</div>
        <h1 class="page-title">НОВОСТИ<br>ПРОЕКТА.</h1>
        <p class="page-description">
            Следите за обновлениями сервера, анонсами ивентов и важными объявлениями администрации.
        </p>

        <div id="newsRoot"></div>
    </div>

    <footer class="main-footer">
        <div class="footer-brand">
            <span>HARD</span>
            <span class="footer-divider">|</span>
            <span>HOUSTON</span>
        </div>
    </footer>

    <div class="news-modal" id="newsModal">
        <div class="news-modal-box">
            <button class="news-modal-close" id="newsModalClose">✕</button>
            <div class="news-modal-image" id="modalImage"></div>
            <div class="news-modal-body">
                <span class="news-tag" id="modalTag" style="display:none;"></span>
                <div class="news-date" id="modalDate"></div>
                <h2 class="news-title" id="modalTitle"></h2>
                <div class="news-text" id="modalText"></div>
            </div>
        </div>
    </div>

    <script src="toggle.js"></script>

    <script id="news-data" type="application/json">
    [
        {
            "tag": "ГЛАВНАЯ НОВОСТЬ",
            "date": "12 августа 2026 · HARD MEDIA",
            "title": "Добро пожаловать в HARD | Houston",
            "excerpt": "Отряд был для меня родной игрой, где каждый житель становится частью общей истории.",
            "text": "Отряд был для меня родной игрой, где каждый житель становится частью общей истории. Мы рады приветствовать вас в HARD | Houston — городе, где каждый может найти своё место.\n\nЗдесь вы сможете начать карьеру, открыть бизнес, вступить во фракцию или просто жить спокойной жизнью. Добро пожаловать!",
            "image": "houston-bg.jpg"
        },
        {
            "tag": "ВАЖНО",
            "date": "10 августа 2026",
            "title": "Городские структуры",
            "excerpt": "Как устроена жизнь городских служб?",
            "text": "Подробный разбор того, как работают городские службы: полиция, скорая, пожарная, мэрия.\n\nКаждая структура имеет свои правила, иерархию и возможности для игроков. Узнайте, как начать службу и подняться по карьерной лестнице.",
            "image": "houston-bg.jpg"
        },
        {
            "tag": "ВАЖНО",
            "date": "05 августа 2026",
            "title": "Бизнес в Хьюстоне",
            "excerpt": "С чего начать свой путь предпринимателя?",
            "text": "В Хьюстоне можно открыть собственное дело — от маленького магазина до крупной корпорации.\n\nМы расскажем, как зарегистрировать бизнес, нанять сотрудников и развивать дело вместе с городом.",
            "image": "houston-bg.jpg"
        }
    ]
    </script>

    <script>
    (function(){
        "use strict";

        const news = JSON.parse(document.getElementById('news-data').textContent);
        const root = document.getElementById('newsRoot');

        function esc(s){
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            })[c]);
        }

        function cardContent(n, isHero){
            return ''+
                (n.tag ? '<span class="news-tag">'+esc(n.tag)+'</span>' : '')+
                (n.date ? '<div class="news-date">'+esc(n.date)+'</div>' : '')+
                (n.title ? '<h3 class="news-title">'+esc(n.title)+'</h3>' : '')+
                (n.excerpt ? '<p class="news-excerpt">'+esc(n.excerpt)+'</p>' : '')+
                (n.title ? '<span class="news-read">'+(isHero?'Читать подробнее':'Читать')+'</span>' : '');
        }

        let html = '<div class="news-wrapper">';

        const hero = news[0];
        const heroBg = hero.image ? 'background-image:url('+esc(hero.image)+');' : '';
        html += '<div class="news-hero" data-idx="0" style="'+heroBg+'">'+
                    '<div class="news-hero-content">'+ cardContent(hero, true) +'</div>'+
                '</div>';

        const rest = news.slice(1);
        for(let i=0; i<rest.length; i+=2){
            html += '<div class="news-row">';
            const row = rest.slice(i, i+2);
            row.forEach((n, j) => {
                const idx = i + j + 1;
                const bg = n.image ? 'background-image:url('+esc(n.image)+');' : '';
                html += '<div class="news-card" data-idx="'+idx+'" style="'+bg+'">'+
                            '<div class="news-card-content">'+ cardContent(n, false) +'</div>'+
                        '</div>';
            });
            html += '</div>';
        }

        html += '</div>';
        root.innerHTML = html;

        const modal      = document.getElementById('newsModal');
        const modalImage = document.getElementById('modalImage');
        const modalTag   = document.getElementById('modalTag');
        const modalDate  = document.getElementById('modalDate');
        const modalTitle = document.getElementById('modalTitle');
        const modalText  = document.getElementById('modalText');

        function openModal(idx){
            const n = news[idx];
            if(!n) return;

            modalImage.style.backgroundImage = n.image ? 'url("'+n.image+'")' : 'none';
            if(n.tag){ modalTag.textContent = n.tag; modalTag.style.display='inline-block'; }
            else { modalTag.style.display='none'; }
            modalDate.textContent  = n.date  || '';
            modalTitle.textContent = n.title || '';
            modalText.textContent  = n.text  || n.excerpt || '';

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeModal(){
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        root.querySelectorAll('.news-hero, .news-card').forEach(card => {
            card.addEventListener('click', function(){
                openModal(Number(card.dataset.idx));
            });
        });

        document.getElementById('newsModalClose').addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
        document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
    })();
    </script>
</body>
</html>
